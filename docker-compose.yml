services:
  db:
    # PostgreSQL 16 + TimescaleDB (solo se usa para el historial de estados; hay fallback a tabla normal)
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gidr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gidr}
      POSTGRES_DB: ${POSTGRES_DB:-gidr}
    volumes:
      - gidr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gidr} -d ${POSTGRES_DB:-gidr}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gidr}:${POSTGRES_PASSWORD:-gidr}@db:5432/${POSTGRES_DB:-gidr}
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion-0123456789}
      AUTO_SEED: ${AUTO_SEED:-true}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  gidr_pgdata:
